<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const mode = localStorage.getItem("portfolio-theme-mode");
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Edmonton", hour: "2-digit", hourCycle: "h23"
        }).formatToParts(new Date());
        const hour = Number(parts.find((part) => part.type === "hour")?.value || 0);
        const automatic = hour >= 7 && hour < 19 ? "light" : "dark";
        const theme = mode === "light" || mode === "dark" ? mode : automatic;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Résumé viewer</title>
    <script type="module" crossorigin src="/calgary-transit-live/assets/pdf-viewer-CRP8x0GY.js"></script>
    <link rel="modulepreload" crossorigin href="/calgary-transit-live/assets/modulepreload-polyfill-wMinxHhO.js">
    <link rel="stylesheet" crossorigin href="/calgary-transit-live/assets/pdf-viewer-B8acR0Sh.css">
  </head>
  <body>
    <header class="pdf-toolbar" aria-label="PDF controls">
      <div>
        <strong>Résumé</strong>
        <span id="page-status" role="status">Loading…</span>
      </div>
      <div class="pdf-toolbar-actions">
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="fit-width" type="button">Fit width</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      </div>
    </header>
    <main id="pdf-pages" aria-busy="true"></main>
    <div id="pdf-error" role="alert" hidden></div>
  </body>
</html>
