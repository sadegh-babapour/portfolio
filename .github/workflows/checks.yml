# Offline checks for pull requests. No deployment, no secrets, no database or
# network services: the Python and Node suites run behind their isolation shims,
# and frontend builds use a synthetic public API target in a temporary directory.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # runtime.txt; production reports 3.13.15
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # the cross-language parity tests run the Node resolver
      - run: python -m pip install -r requirements.txt
      - run: python test/run_isolated.py
      - run: python -m compileall -q app poller scripts test migrations ops pipelines test_data

  # The reporting pipeline against a real Postgres that exists only for this job:
  # loader behaviour (re-runs, revisions, rollback) on a recorded API response, then
  # every dbt model and test. No network data source and no secrets.
  data:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reporting_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d reporting_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATA_CI_PG_HOST: localhost
      DATA_CI_PG_PORT: "5432"
      DATA_CI_PG_DBNAME: reporting_ci
      DATA_CI_PG_USER: ci
      DATA_CI_PG_PASSWORD: ci-only-throwaway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      # dbt, Dagster and the loader's libraries (the full app pins protobuf 5, dbt needs 6).
      - run: python -m venv .venv-data && .venv-data/bin/pip install -r requirements-data.txt
      - run: .venv-data/bin/dbt parse --project-dir warehouse --profiles-dir warehouse
        env:
          DBT_PG_HOST: localhost
          DBT_PG_PORT: "5432"
          DBT_PG_DBNAME: reporting_ci
          DBT_PG_USER: ci
          DBT_ENV_SECRET_PG_PASSWORD: ci-only-throwaway
          DBT_PG_SSLMODE: disable
      # Loads the Dagster definitions; the dbt manifest is parsed with placeholder settings.
      - run: .venv-data/bin/dagster definitions validate -m orchestration.definitions
      - run: .venv-data/bin/python -m unittest discover -s test_data -v
      # The Railway `dagster` image builds, refuses the CI superuser, and starts as
      # bizqlab_dagster with its run history in the `dagster` schema. The role's password
      # is random per run.
      - run: >-
          docker build -f orchestration/Dockerfile -t bizqlab-dagster
          --build-arg RAILWAY_SERVICE_ID=ci-service --build-arg RAILWAY_ENVIRONMENT_ID=ci-env .
      - env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: reporting_ci
          PGUSER: ci
          PGPASSWORD: ci-only-throwaway
        run: |
          railway_env="-e BIZQLAB_RUNTIME=production -e RAILWAY_PROJECT_ID=ci-project -e RAILWAY_SERVICE_ID=ci-service -e RAILWAY_ENVIRONMENT_ID=ci-env"
          if docker run --rm --network host $railway_env \
              -e DATABASE_URL="postgresql://$PGUSER:$PGPASSWORD@localhost:5432/$PGDATABASE" \
              bizqlab-dagster > refused.txt 2>&1; then
            cat refused.txt; echo "expected the superuser URL to be refused"; exit 1
          fi
          cat refused.txt
          grep -q "BIZQLAB DAGSTER REFUSED: wrong_role" refused.txt

          # Start clean, so the tables counted below are the daemon's own.
          psql -v ON_ERROR_STOP=1 -q -c "drop schema if exists dagster cascade"
          psql -v ON_ERROR_STOP=1 -q -f ops/sql/railway_dagster_role.sql
          role_password="$(openssl rand -hex 16)"
          psql -v ON_ERROR_STOP=1 -q -c "alter role bizqlab_dagster password '$role_password'"
          timeout 90 docker run --rm --network host $railway_env \
              -e DATABASE_URL="postgresql://bizqlab_dagster:$role_password@localhost:5432/$PGDATABASE" \
              bizqlab-dagster > started.txt 2>&1 || true
          grep -v "$role_password" started.txt | tail -20
          grep -q "database role checked; starting dagster-daemon" started.txt
          test "$(psql -tAc "select count(*) from pg_tables where schemaname = 'dagster'")" -gt 0
          test "$(psql -tAc "select count(*) from pg_tables where schemaname = 'public'")" -eq 0
          ! grep -q "$role_password" started.txt

  transit-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/transit_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # production reports Node 22.23.3
          cache: npm
          cache-dependency-path: backend/transit_api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Preview build with a synthetic API target (tracked dist/ untouched)
        env:
          VITE_TRANSIT_API_BASE_URL: https://transit-api-preview.example/api
        run: |
          npm run build:preview -- --outDir "$RUNNER_TEMP/dist-preview" --emptyOutDir
          python3 ../ops/check_frontend_bundle.py --dist "$RUNNER_TEMP/dist-preview" --expect-api "$VITE_TRANSIT_API_BASE_URL"
      - name: Release build (tracked dist/ untouched)
        run: |
          npm run build -- --outDir "$RUNNER_TEMP/dist-release" --emptyOutDir
          python3 ../ops/check_frontend_bundle.py --dist "$RUNNER_TEMP/dist-release" --expect-api https://transit-api-production.up.railway.app/api
