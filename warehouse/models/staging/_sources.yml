version: 2

sources:
  - name: raw
    description: Tables the pipelines load (pipelines/). Only the loaders write them.
    schema: raw
    tables:
      - name: boc_series
        description: Bank of Canada Valet series metadata, one row per series.
      - name: boc_observations
        description: Bank of Canada observations, one row per series per date, values as published.
        # Freshness of the data itself: the newest date published. Weekends and
        # holidays have no rates, hence the slack.
        loaded_at_field: "obs_date::timestamp"
        freshness:
          warn_after: {count: 4, period: day}
          error_after: {count: 7, period: day}
      - name: load_runs
        description: One row per loader run, for every source.
