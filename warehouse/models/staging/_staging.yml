version: 2

models:
  - name: stg_boc__observations
    description: Bank of Canada observations with our measure name. Grain is one row per series per date.
    data_tests:
      - unique_combination:
          arguments:
            columns: [series_id, obs_date]
    columns:
      - name: series_id
        data_tests:
          - not_null
          # A series in raw that the catalog does not know about would get no measure name.
          - relationships:
              arguments:
                to: ref('boc_series_catalog')
                field: series_id
      - name: measure
        data_tests: [not_null]
      - name: obs_date
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]

seeds:
  - name: boc_series_catalog
    description: >
      Our names for the Bank of Canada series and the range a value must fall in.
      A value outside it fails the build (tests/assert_values_in_expected_range.sql).
    columns:
      - name: series_id
        data_tests: [unique, not_null]
      - name: measure
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [rate, yield, fx]
